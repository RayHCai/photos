[project]
name = "photos-worker"
version = "0.1.0"
description = "Python worker service for media processing, CLIP embeddings, and face recognition"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bullmq>=2.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "open-clip-torch>=2.26",
    "torch>=2.4",
    "insightface>=0.7",
    "onnxruntime>=1.19",
    "numpy>=1.26",
    "hdbscan>=0.8",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "blurhash-python>=1.1",
]

[project.optional-dependencies]
# Declared so CI can install the toolchain the repo already claims to enforce.
# ruff and mypy were configured below but installed by nothing, so neither had ever
# actually run against this code.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
worker = "worker.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# torch, insightface, open_clip, hdbscan and blurhash ship no type information, and
# stubs do not exist. Without this, strict mode fails on the import lines alone and
# the check is unrunnable — which is why it had never been run.
[[tool.mypy.overrides]]
module = [
    "blurhash.*",
    "bullmq.*",
    "hdbscan.*",
    "insightface.*",
    "open_clip.*",
    "pillow_heif.*",
    "structlog.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Importing worker.config at collection time constructs Settings, which now *requires*
# WORKER_SECRET. tests/conftest.py sets it before any worker module is imported, which
# keeps the suite independent of the developer's .env.
