<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
</head>
<body>
<title>Gallery Scroll Lab</title>
<style>
/* Layout: phone = slim viewer bar on top + full-bleed stage; desktop = sidebar + phone frame.
   Palette mirrors a native photos app: neutral surfaces, one blue accent, translucent bars. */
:root{
  --bg:#f4f4f6; --fg:#1a1a1e; --mut:#6b6b73; --line:#e3e3e8; --card:#ffffff;
  --acc:#1a73e8; --acc-fg:#ffffff; --bar:rgba(255,255,255,.84); --sheet:#ffffff;
  --tile:#dcdce1; --ovl:rgba(0,0,0,.55); --frame:#111114; --sel:#1a73e8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --fg:#f2f2f5; --mut:#9a9aa3; --line:#26262c; --card:#17171b;
    --acc:#8ab4f8; --acc-fg:#0e0e11; --bar:rgba(14,14,17,.8); --sheet:#1b1b20;
    --tile:#2a2a30; --ovl:rgba(0,0,0,.62); --frame:#2a2a30; --sel:#8ab4f8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --fg:#f2f2f5; --mut:#9a9aa3; --line:#26262c; --card:#17171b;
  --acc:#8ab4f8; --acc-fg:#0e0e11; --bar:rgba(14,14,17,.8); --sheet:#1b1b20;
  --tile:#2a2a30; --ovl:rgba(0,0,0,.62); --frame:#2a2a30; --sel:#8ab4f8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}

/* ---------- viewer chrome ---------- */
.vbar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(36px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 4px 0;display:flex;align-items:center;gap:4px;
  background:var(--frame);color:#fff}
.vbar button{border:0;background:transparent;color:#fff;height:36px;display:flex;align-items:center;justify-content:center}
.vbar .arrow{width:44px;font-size:24px;line-height:1}
.vbar .name{flex:1;gap:8px;font-size:13px;font-weight:600;letter-spacing:.01em}
.vbar .num{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(255,255,255,.18);font-size:12px;font-variant-numeric:tabular-nums}
.vbar .hint{font-weight:400;opacity:.6;font-size:11px}
.stage{position:fixed;top:calc(36px + env(safe-area-inset-top,0px));left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.ovl{position:absolute;inset:0;pointer-events:none;z-index:6}
.ovl>*{pointer-events:auto}
.side{display:none}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:82%;overflow-y:auto;background:var(--sheet);color:var(--fg);
  border-radius:18px 18px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 16px;align-items:start;border-radius:10px;margin:0 8px;cursor:pointer}
.list li.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.list .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.list li.on .n{background:var(--acc);color:var(--acc-fg)}
.list .ttl{font-weight:600;font-size:15px}
.list .mim{font-size:12px;color:var(--mut);margin-top:1px}
.notes{padding:12px 16px 4px;border-top:1px solid var(--line);margin-top:8px}
.notes h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.notes p{margin:0 0 8px;font-size:14px;line-height:1.45}
.notes ul{margin:0 0 8px;padding-left:18px;font-size:14px;line-height:1.45}

@media (min-width:760px){
  body{display:grid;grid-template-columns:320px 1fr;height:100%}
  .vbar{display:none}
  .side{display:block;overflow-y:auto;border-right:1px solid var(--line);background:var(--card);padding:16px 0 24px}
  .side h1{font-size:17px;margin:0 16px 2px;letter-spacing:-.01em}
  .side .lead{margin:0 16px 12px;font-size:13px;color:var(--mut);line-height:1.4}
  .stage{position:relative;top:auto;left:auto;right:auto;bottom:auto;width:390px;height:min(844px,calc(100vh - 48px));margin:24px auto;
    border:10px solid var(--frame);border-radius:46px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .screen{border-radius:36px}
  .ovl{border-radius:36px;overflow:hidden}
  .sheet,.scrim{display:none}
}

/* ---------- shared photo-app pieces ---------- */
.appbar{position:sticky;top:0;z-index:5;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;
  background:var(--bar);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  transition:transform .22s ease,opacity .22s ease;font-weight:700;font-size:20px;letter-spacing:-.02em}
.appbar.hide{transform:translateY(-100%)}
.appbar .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:transparent;border:0;font-size:17px;font-weight:600}
.ic:active{background:color-mix(in srgb,var(--fg) 10%,transparent)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f5a623,#e0457b)}
.sec{padding-bottom:10px}
.sec.cv{content-visibility:auto}
.hd{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hd.sticky{position:sticky;top:0;z-index:4;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd .sub{font-weight:400;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.hd.big{height:58px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd.small{height:32px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:2px;padding:0 4px}
.t{position:relative;aspect-ratio:1;overflow:hidden;background:var(--tile);contain:layout paint;border-radius:var(--tr,0)}
.t.v::after{content:"\25B6\00a0" attr(data-d);position:absolute;right:5px;bottom:4px;font:600 10px/1 var(--font);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);letter-spacing:.02em}
/* procedural "photos": six scene types driven by a hue token, so 1,400 tiles cost no network */
.t.s0{background:linear-gradient(180deg,hsl(var(--h) 65% 74%),hsl(var(--h) 60% 54%) 57%,hsl(calc(var(--h) - 170) 22% 30%) 57.6%,hsl(calc(var(--h) - 170) 18% 20%))}
.t.s1{background:radial-gradient(circle at 72% 24%,hsl(46 95% 86%) 0 6%,transparent 7%),linear-gradient(168deg,hsl(var(--h) 42% 58%),hsl(var(--h) 40% 28%))}
.t.s2{background:radial-gradient(ellipse 36% 44% at 50% 60%,hsl(var(--h) 48% 74%) 0 60%,transparent 62%),linear-gradient(180deg,hsl(calc(var(--h) + 190) 18% 78%),hsl(calc(var(--h) + 190) 16% 46%))}
.t.s3{background:radial-gradient(circle at 76% 22%,hsl(52 80% 94%) 0 4.5%,transparent 5.5%),linear-gradient(180deg,hsl(var(--h) 48% 14%),hsl(var(--h) 40% 30%))}
.t.s4{background:radial-gradient(circle at 50% 56%,hsl(var(--h) 78% 54%) 0 29%,hsl(0 0% 97%) 30% 43%,transparent 44%),linear-gradient(160deg,hsl(32 24% 72%),hsl(26 24% 44%))}
.t.s5{background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.14) 11px 16px),linear-gradient(180deg,hsl(var(--h) 36% 76%) 0 44%,hsl(var(--h) 12% 46%) 44% 100%)}
.bnav{position:sticky;bottom:0;z-index:5;display:flex;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav button{flex:1;border:0;background:none;color:var(--mut);font:500 11px var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:9px}
.bnav button .g{font-size:18px;line-height:1}
.bnav button.on{color:var(--acc)}
.pill{position:absolute;padding:7px 12px;border-radius:999px;background:var(--ovl);color:#fff;font-size:13px;font-weight:600;letter-spacing:-.01em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.pill.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="vbar">
  <button class="arrow" id="prevBtn" aria-label="Previous design">&#8249;</button>
  <button class="name" id="nameBtn"><span class="num" id="numLbl">1</span><span id="nameLbl">Sticky Days</span><span class="hint">tap for list</span></button>
  <button class="arrow" id="nextBtn" aria-label="Next design">&#8250;</button>
</div>
<aside class="side">
  <h1>Gallery Scroll Lab</h1>
  <p class="lead">Ten ways to scroll a mobile photo library, after Google Photos and Apple Photos. Open this page on a phone for real touch; here the frame scrolls with the wheel.</p>
  <ul class="list" id="sideList"></ul>
  <div class="notes" id="sideNotes"></div>
</aside>
<div class="stage" id="stage"><div class="screen" id="screen"></div><div class="ovl" id="ovl"></div></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <ul class="list" id="sheetList"></ul>
  <div class="notes" id="sheetNotes"></div>
</div>
<script>
/* ================= sample library (seeded, deterministic) ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261031);
const TODAY=new Date(2026,9,31,0,0,0,0);
const DAY=86400000;
const ARS=[1,1,4/3,4/3,3/4,3/4,16/9,9/16,3/2,2/3];
const SCENE_H=[[195,225],[85,150],[15,40],[215,250],[0,40],[200,230]];
const LOCS=['Lisbon','Big Sur','Kyoto','Oslo','Mexico City','Joshua Tree','Vancouver'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pick(a){return a[Math.floor(rnd()*a.length)]}
function mkPhoto(id,t,bias){
  const s=(bias!=null&&rnd()<0.6)?bias:Math.floor(rnd()*6);
  const [h0,h1]=SCENE_H[s]; const h=Math.round(h0+rnd()*(h1-h0));
  const v=rnd()<0.1; return {id,t,s,h,ar:pick(ARS),v,d:v?Math.round(3+rnd()*85):0};
}
const days=[]; let pid=0;
const trips=new Map();
for(let k=0;k<7;k++){const start=5+Math.floor(rnd()*560),len=3+Math.floor(rnd()*5),bias=Math.floor(rnd()*6),loc=LOCS[k];for(let j=0;j<len;j++)trips.set(start+j,{bias,loc});}
for(let back=0;back<600;back++){
  const trip=trips.get(back);
  if(!trip&&rnd()>0.42)continue;
  const n=trip?10+Math.floor(rnd()*22):(rnd()<0.8?1+Math.floor(rnd()*5):6+Math.floor(rnd()*10));
  const date=new Date(TODAY.getTime()-back*DAY);
  const photos=[];for(let i=0;i<n;i++)photos.push(mkPhoto(pid++,date.getTime()+8*3600000+Math.floor(rnd()*14*3600000),trip?trip.bias:null));
  photos.sort((a,b)=>b.t-a.t);
  days.push({key:date.toISOString().slice(0,10),date,photos,loc:trip?trip.loc:null});
}
const months=[];const byM=new Map();
for(const d of days){const k=d.date.getFullYear()+'-'+d.date.getMonth();let m=byM.get(k);if(!m){m={key:k,date:new Date(d.date.getFullYear(),d.date.getMonth(),1),days:[],count:0};byM.set(k,m);months.push(m);}m.days.push(d);m.count+=d.photos.length;}
const years=[];const byY=new Map();
for(const m of months){const y=m.date.getFullYear();let yr=byY.get(y);if(!yr){yr={year:y,months:[],count:0};byY.set(y,yr);years.push(yr);}yr.months.push(m);yr.count+=m.count;}
const allPhotos=days.flatMap(d=>d.photos);
const photoById=new Map(allPhotos.map(p=>[p.id,p]));
const TOTAL=allPhotos.length;

/* ================= labels ================= */
function dayLabel(d){const diff=Math.round((TODAY-d)/DAY);if(diff===0)return'Today';if(diff===1)return'Yesterday';const s=DN[d.getDay()]+', '+MS[d.getMonth()]+' '+d.getDate();return d.getFullYear()===TODAY.getFullYear()?s:s+', '+d.getFullYear();}
function monthLabel(d){return MN[d.getMonth()]+' '+d.getFullYear()}
function monthShort(d){return MS[d.getMonth()]+' '+d.getFullYear()}
function fmtDur(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ================= tile + grid builders ================= */
function tile(p,o){o=o||{};return'<div class="t s'+p.s+(p.v?' v':'')+(o.cls?' '+o.cls:'')+'" style="--h:'+p.h+';--ar:'+p.ar.toFixed(4)+(o.style?';'+o.style:'')+'" data-id="'+p.id+'"'+(p.v?' data-d="'+fmtDur(p.d)+'"':'')+(o.attrs?' '+o.attrs:'')+'>'+(o.inner||'')+'</div>'}
function bnav(active){return'<nav class="bnav">'+[['photos','&#9638;','Photos'],['search','&#9906;','Search'],['library','&#9641;','Library']].map(a=>'<button class="'+(a[0]===active?'on':'')+'"><span class="g">'+a[1]+'</span>'+a[2]+'</button>').join('')+'</nav>'}
function gridHtml(photos,cols,extraClass){return'<div class="grid'+(extraClass?' '+extraClass:'')+'" style="--c:'+cols+'">'+photos.map(p=>tile(p)).join('')+'</div>'}
function cellSize(W,cols,pad,gap){pad=pad==null?4:pad;gap=gap==null?2:gap;return(W-pad*2-(cols-1)*gap)/cols}
function gridHeight(n,W,cols,pad,gap){const c=cellSize(W,cols,pad,gap);const r=Math.ceil(n/cols);return r*c+(r-1)*(gap==null?2:gap)}
/* exact intrinsic height lets content-visibility:auto skip offscreen sections without the scroll height drifting */
function daySection(day,o){
  o=o||{};const cols=o.cols||3,hh=o.headerH!=null?o.headerH:44,pb=o.pb!=null?o.pb:10;
  const h=hh+gridHeight(day.photos.length,o.W,cols,o.pad,o.gap)+pb;
  const cls='hd'+(o.sticky?' sticky':'')+(o.big?' big':'')+(o.small?' small':'');
  return'<section class="sec cv" data-key="'+day.key+'" data-m="'+day.date.getFullYear()+'-'+day.date.getMonth()+'" style="contain-intrinsic-size:auto '+Math.round(h)+'px'+(pb!==10?';padding-bottom:'+pb+'px':'')+'">'+
    (hh?'<div class="'+cls+'">'+(o.label||dayLabel(day.date))+(day.loc&&o.loc?'<span class="sub">'+day.loc+'</span>':'')+'</div>':'')+
    gridHtml(day.photos,cols)+'</section>';
}

/* ================= scroll helpers ================= */
function onScroll(el,fn){let tick=false;const h=()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;fn(el.scrollTop)})};el.addEventListener('scroll',h,{passive:true});return()=>el.removeEventListener('scroll',h)}
function sectionOffsets(root,sel){const out=[];root.querySelectorAll(sel||'.sec').forEach(el=>out.push({top:el.offsetTop,el,key:el.dataset.key,m:el.dataset.m}));return out}
function findAt(offs,y){let lo=0,hi=offs.length-1,ans=0;while(lo<=hi){const mid=(lo+hi)>>1;if(offs[mid].top<=y){ans=mid;lo=mid+1}else hi=mid-1}return offs[ans]}
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms||8)}catch(e){}}
function appbar(title,right){return'<div class="appbar"><span>'+title+'</span><span class="sp"></span>'+(right||'<button class="ic" aria-label="Search">&#9906;</button><span class="av"></span>')+'</div>'}
function hideOnScroll(screen,bar){let last=screen.scrollTop;return onScroll(screen,y=>{const dy=y-last;if(y<8||dy<-6)bar.classList.remove('hide');else if(dy>6)bar.classList.add('hide');last=y;})}
const monthOf=m=>months.find(x=>x.key===m);

/* ================= viewer ================= */
const DESIGNS=[];
const $=id=>document.getElementById(id);
let screen=$('screen'),ovl=$('ovl');
let cur=1,cleanup=null,lastW=0,rt=null;
const ro=new ResizeObserver(()=>{const w=screen.clientWidth;if(!lastW){lastW=w;return}if(w===lastW)return;lastW=w;clearTimeout(rt);rt=setTimeout(()=>mount(cur),150)});
ro.observe(screen);
/* a fresh screen element per design, so listeners a design attached never leak into the next one */
function mount(i){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  cur=i;const d=DESIGNS[i-1];
  ro.unobserve(screen);
  $('stage').className='stage d'+i; /* on the stage, so design CSS reaches both the screen and its overlay */
  const ns=document.createElement('div');ns.id='screen';ns.className='screen';screen.replaceWith(ns);screen=ns;
  const no=document.createElement('div');no.id='ovl';no.className='ovl';ovl.replaceWith(no);ovl=no;
  ro.observe(screen);
  const ctx={screen,ovl,W:screen.clientWidth,H:screen.clientHeight};
  cleanup=d.render(ctx)||null;
  $('numLbl').textContent=i;$('nameLbl').textContent=d.name;
  renderLists();
  try{history.replaceState(null,'','#d'+i)}catch(e){}
  try{localStorage.setItem('gsl-design',String(i))}catch(e){}
}
function notesHtml(d){return'<h3>Mimics</h3><p>'+d.mimics+'</p><h3>Try</h3><ul>'+d.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul><h3>Trade-offs</h3><p>'+d.tradeoffs+'</p><p style="color:var(--mut);font-size:12px">'+TOTAL+' sample photos across '+days.length+' days and '+months.length+' months. Tiles are procedural so the scroll is judged on layout, not network.</p>'}
function renderLists(){
  const html=DESIGNS.map((d,k)=>'<li class="'+(k+1===cur?'on':'')+'" data-i="'+(k+1)+'"><span class="n">'+(k+1)+'</span><div><div class="ttl">'+d.name+'</div><div class="mim">'+d.blurb+'</div></div></li>').join('');
  $('sideList').innerHTML=html;$('sheetList').innerHTML=html;
  $('sideNotes').innerHTML=notesHtml(DESIGNS[cur-1]);$('sheetNotes').innerHTML=notesHtml(DESIGNS[cur-1]);
}
function openSheet(o){$('sheet').hidden=!o;$('scrim').hidden=!o;if(o){const on=$('sheetList').querySelector('.on');if(on)on.scrollIntoView({block:'center'})}}
document.addEventListener('click',e=>{
  const li=e.target.closest('.list li');if(li){mount(+li.dataset.i);openSheet(false);return}
  if(e.target.closest('#scrim'))openSheet(false);
});
$('prevBtn').onclick=()=>mount((cur+DESIGNS.length-2)%DESIGNS.length+1);
$('nextBtn').onclick=()=>mount(cur%DESIGNS.length+1);
$('nameBtn').onclick=()=>openSheet(true);
function boot(){
  let i=1;const m=/^#d(\d+)$/.exec(location.hash);
  if(m)i=+m[1];else{try{i=+(localStorage.getItem('gsl-design')||1)}catch(e){}}
  if(!(i>=1&&i<=DESIGNS.length))i=1;
  mount(i);
}
/* ================= 1. Sticky Days ================= */
DESIGNS.push({
  name:'Sticky Days',
  blurb:'Google Photos default: day headers pin under the bar, 3-column squares',
  mimics:'Google Photos on Android and iOS. Each day header sticks to the top and is pushed out by the next one. The app bar slides away on scroll-down and comes back on scroll-up. The bottom tabs never move.',
  tips:['Fling through a busy month and watch headers hand off to each other.','Scroll up a few pixels: the app bar returns without the grid jumping.','Headers are pure CSS sticky, so they cost nothing per frame.'],
  tradeoffs:'A pinned header takes 44px of the viewport at all times. It needs real position:sticky, which the current virtualized grid cannot use because its rows are absolutely positioned.',
  css:'.d1 .sec{padding-bottom:6px}',
  render:function(c){
    c.screen.innerHTML=appbar('Photos')+days.map(d=>daySection(d,{W:c.W,sticky:true})).join('')+bnav('photos');
    return hideOnScroll(c.screen,c.screen.querySelector('.appbar'));
  }
});

/* ================= 2. Date Pill + Scrubber ================= */
DESIGNS.push({
  name:'Date Pill + Scrubber',
  blurb:'Google Photos fast-scroll handle with a month bubble; headers flow inline',
  mimics:'Google Photos. Headers scroll with the content. While you scroll, a handle appears on the right edge and a date chip floats at the top-left. Drag the handle to jump anywhere; a bubble names the month under your thumb and ticks as it changes.',
  tips:['Scroll, then grab the handle on the right edge and drag.','Feel the tick (vibration on Android) as the bubble changes month.','Let go: the handle fades after a second and a half.'],
  tradeoffs:'The handle sits over the last column, so the grid needs a right gutter (the app already reserves 32px for this). Drag precision is coarse on a long library: one pixel of thumb can be several days.',
  css:'.d2 .grid{padding-right:8px}'+

    screen.innerHTML=appbar('Photos')+months.map((m,i)=>'<div class="mc" data-i="'+i+'"><div class="mh"><b>'+monthLabel(m.date)+'</b><span class="cnt">'+m.count+' items &middot; '+m.days.length+' days</span><span class="chev">&#8964;</span></div>'+strip(m)+'<div class="body"><div></div></div></div>').join('')+'<div style="height:60px"></div>';
    screen.addEventListener('click',e=>{
      const mc=e.target.closest('.mc');if(!mc)return;

});

/* ================= 8. Fast-Scroll Overlay ================= */
DESIGNS.push({
  name:'Fast-Scroll Overlay',
  blurb:'Fling fast and a big month label appears mid-screen, then melts away as you slow',
  mimics:'Google Photos when you drag the scrubber, and the Android fast-scroll pattern. The grid itself is the plain 3-column layout. The design is in what happens during a fling: above a velocity threshold a large month and day label fades in over the grid and the app bar hides, so the eye reads the date instead of blurred thumbnails. It fades the moment the scroll calms.',
  tips:['Flick hard: the overlay should appear within one frame and track the month as the fling decays.','Scroll slowly: nothing appears at all.','Flick, then touch to stop the fling: the overlay drops instantly.'],
  tradeoffs:'Purely additive, costs one overlay element. Thresholds need tuning per device; a cheap phone scrolls fewer pixels per second. Does not help a user who scrolls slowly through a huge library.',
  css:'.d8 .fastov{position:absolute;left:0;right:0;top:38%;display:flex;justify-content:center;opacity:0;transform:scale(.96);transition:opacity .14s,transform .14s;pointer-events:none}'+
    '.d8 .fastov.show{opacity:1;transform:none}'+
    '.d8 .fastov div{padding:14px 28px;border-radius:18px;background:var(--ovl);color:#fff;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}'+

    '.d8 .fastov small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:2px}'+
    '.d8 .dim{position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;transition:opacity .2s;pointer-events:none}'+
    '.d8 .dim.show{opacity:1}',
  render:function(c){

    ovl.innerHTML='<div class="dim"></div><div class="fastov"><div><b></b><small></small></div></div>';
    const dim=ovl.querySelector('.dim'),fo=ovl.querySelector('.fastov'),bm=fo.querySelector('b'),sm=fo.querySelector('small');
    const bar=screen.querySelector('.appbar');const offs=sectionOffsets(screen);
    let lastY=screen.scrollTop,lastT=performance.now(),fast=false,calmT=null,lm=null,last=lastY;
    const FAST=2600,CALM=1100;
    function setFast(on){if(fast===on)return;fast=on;dim.classList.toggle('show',on);fo.classList.toggle('show',on);if(on)bar.classList.add('hide')}
    const h=()=>{
      const y=screen.scrollTop,t=performance.now();const dt=Math.max(1,t-lastT);const v=Math.abs(y-lastY)/dt*1000;

  }

/* ================= 9. Press & Drag Select ================= */
DESIGNS.push({

  css:'.d9 .t{transition:transform .14s,border-radius .14s}'+

    '.d9 .t.sel::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--sel) 24%,transparent)}'+
    '.d9 .ck{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.4);opacity:0;transition:opacity .12s;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;z-index:1}'+
    '.d9 .selmode .ck{opacity:1}'+

    '.d9 .hd .dck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:none;place-items:center;color:#fff;font-size:12px;cursor:pointer;flex:0 0 auto}'+
    '.d9 .selmode .hd .dck{display:grid}'+
    '.d9 .hd .dck.on{background:var(--sel);border-color:var(--sel)}'+
    '.d9 .hd .dck.on::after{content:"\\2713"}'+
    '.d9 .selbar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--card);box-shadow:0 1px 0 var(--line);transform:translateY(-100%);transition:transform .2s}'+
    '.d9 .selbar.show{transform:none}'+
    '.d9 .selbar b{font-size:17px;margin-left:4px;font-variant-numeric:tabular-nums}'+
    '.d9 .acts{position:absolute;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -1px 0 var(--line);transform:translateY(110%);transition:transform .2s}'+

  render:function(c){

    function sec(d,i){const h=44+gridHeight(d.photos.length,W,3)+10;return'<section class="sec cv" data-key="'+d.key+'" data-i="'+i+'" style="contain-intrinsic-size:auto '+Math.round(h)+'px"><div class="hd sticky"><span class="dck" data-day="'+i+'"></span>'+dayLabel(d.date)+'</div><div class="grid" style="--c:3">'+d.photos.map(p=>tile(p,{inner:'<b class="ck"></b>'})).join('')+'</div></section>'}

    ovl.innerHTML='<div class="selbar"><button class="ic" data-act="close" aria-label="Clear selection">&#10005;</button><b>0 selected</b><span class="sp" style="flex:1"></span><button class="ic" aria-label="More">&#8942;</button></div>'+
      '<div class="acts"><button><span class="g">&#8679;</span>Share</button><button><span class="g">&#10010;</span>Add to</button><button><span class="g">&#9825;</span>Favorite</button><button><span class="g">&#128465;</span>Delete</button></div><div class="pill toast"></div>';
    const selbar=ovl.querySelector('.selbar'),acts=ovl.querySelector('.acts'),count=selbar.querySelector('b'),toast=ovl.querySelector('.toast');
    const tileEl=new Map();screen.querySelectorAll('.t').forEach(el=>tileEl.set(+el.dataset.id,el));
    const dck=[...screen.querySelectorAll('.dck')];

    function setSel(id,on){if(on===sel.has(id))return;on?sel.add(id):sel.delete(id);const el=tileEl.get(id);if(el)el.classList.toggle('sel',on)}
    function refreshDay(di){const d=days[di];dck[di].classList.toggle('on',d.photos.every(p=>sel.has(p.id)))}

    function updateUI(){count.textContent=sel.size+' selected';selbar.classList.toggle('show',selmode);acts.classList.toggle('show',selmode);screen.classList.toggle('selmode',selmode)}
    function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1100)}
    function exitMode(){selmode=false;for(const id of [...sel])setSel(id,false);dck.forEach(x=>x.classList.remove('on'));updateUI()}
    let press=null,paint=null,af=0,px=0,py=0,prevLo=-1,prevHi=-1;
    function startPaint(id,pointerId){if(!selmode){selmode=true}const on=!sel.has(id);setSel(id,on);const i=idxById.get(id);refreshDay(dayOfIdx[i]);haptic(14);paint={anchor:i,cur:i,on,base:new Set(sel)};prevLo=prevHi=i;try{screen.setPointerCapture(pointerId)}catch(e){}updateUI()}
    function applyAt(x,y){const el=document.elementFromPoint(x,y);const t=el&&el.closest('.t');if(!t)return;const i=idxById.get(+t.dataset.id);if(i===paint.cur)return;paint.cur=i;
      const lo=Math.min(paint.anchor,i),hi=Math.max(paint.anchor,i);const a=Math.min(lo,prevLo),b=Math.max(hi,prevHi);

    function edgeV(){const r=screen.getBoundingClientRect();const top=py-r.top,bot=r.bottom-py;if(top<70)return-(70-top)/70*16;if(bot<96)return(96-bot)/96*16;return 0}
    function loop(){af=requestAnimationFrame(()=>{if(!paint){af=0;return}const v=edgeV();if(v===0){af=0;return}screen.scrollTop+=v;applyAt(px,py);loop()})}
    const onDown=e=>{if(e.button!==0&&e.pointerType==='mouse')return;if(e.target.closest('.dck'))return;const t=e.target.closest('.t');if(!t)return;const id=+t.dataset.id;press={id,x:e.clientX,y:e.clientY,el:t,fired:false};press.timer=setTimeout(()=>{press.fired=true;startPaint(id,e.pointerId)},320)};
    const onMove=e=>{if(press&&!press.fired){if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>8){clearTimeout(press.timer);press=null}return}if(!paint)return;px=e.clientX;py=e.clientY;applyAt(px,py);if(!af&&edgeV()!==0)loop()};
    const onUp=e=>{if(press&&!press.fired){clearTimeout(press.timer);if(e.type==='pointerup'){if(selmode){setSel(press.id,!sel.has(press.id));refreshDay(dayOfIdx[idxById.get(press.id)]);updateUI()}else{press.el.animate([{opacity:.5},{opacity:1}],180);say('Tap opens the photo')}}}press=null;if(paint){paint=null;cancelAnimationFrame(af);af=0}};
    const tm=e=>{if(paint)e.preventDefault()};
    screen.addEventListener('pointerdown',onDown);screen.addEventListener('pointermove',onMove);screen.addEventListener('pointerup',onUp);screen.addEventListener('pointercancel',onUp);

/* ================= 10. Timeline Rail ================= */
DESIGNS.push({
  name:'Timeline Rail',
  blurb:'An always-visible year and month index on the right edge, drag it to jump',
  mimics:'The iOS Contacts index and the current app\'s timeline scrollbar, taken further. The rail shows every month as a tick and every year as a label, spaced by how much content each holds. A marker tracks where you are; drag the rail and the grid jumps instantly with a month bubble. Month boundaries in the grid get a large header so the rail and the content speak the same language.',
  tips:['Drag the rail slowly across a year label and feel the tick at each month.','Tap a spot on the rail: the grid glides there instead of jumping.','Scroll normally and watch the marker and bubble follow.'],
  tradeoffs:'Permanently gives up 44px of width (about one column at six-up). Spacing by content means empty months vanish and dense trips dominate the rail; spacing by time has the opposite problem. The app already reserves this gutter.',
  css:'.d10 .grid{padding:0 44px 0 4px}'+
    '.d10 .rail{position:absolute;top:52px;right:0;bottom:0;width:44px;touch-action:none;cursor:pointer}'+
    '.d10 .tick{position:absolute;right:19px;width:7px;height:2px;background:var(--mut);opacity:.4}'+
    '.d10 .ytick{position:absolute;right:9px;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.02em}'+
    '.d10 .cur{position:absolute;right:8px;width:30px;height:3px;border-radius:2px;background:var(--acc);transform:translateY(-50%);box-shadow:0 0 0 2px var(--bg)}'+
    '.d10 .lbl{position:absolute;right:46px;transform:translateY(-50%);padding:6px 11px;border-radius:999px;background:var(--acc);color:var(--acc-fg);font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .18s;pointer-events:none}'+
    '.d10 .rail.on .lbl{opacity:1}'+
    '.d10 .hd.big .sub{font-size:14px}',
  render:function(c){
    const screen=c.screen,ovl=c.ovl,W=c.W,H=c.H;
    screen.innerHTML=appbar('Photos')+days.map((d,i)=>{const first=i===0||days[i-1].date.getMonth()!==d.date.getMonth()||days[i-1].date.getFullYear()!==d.date.getFullYear();
      return first?daySection(d,{W,pad:24,big:true,headerH:58,label:monthLabel(d.date)+'<span class="sub">'+dayLabel(d.date)+'</span>'}):daySection(d,{W,pad:24,small:true,headerH:32})}).join('')+'<div style="height:40px"></div>';
    ovl.innerHTML='<div class="rail"><div class="ticks"></div><div class="cur"></div><div class="lbl"></div></div>';
    const rail=ovl.querySelector('.rail'),ticks=rail.querySelector('.ticks'),cur=rail.querySelector('.cur'),lbl=rail.querySelector('.lbl');
    const offs=sectionOffsets(screen);const railH=rail.clientHeight,PAD=10;
    const maxScroll=()=>Math.max(1,screen.scrollHeight-screen.clientHeight);
    const toRail=top=>PAD+Math.min(1,top/maxScroll())*(railH-PAD*2);
    let html='',seenM=new Set(),seenY=new Set();
    for(const s of offs){if(seenM.has(s.m))continue;seenM.add(s.m);const y=+s.m.split('-')[0];const t=toRail(s.top);if(!seenY.has(y)){seenY.add(y);html+='<div class="ytick" style="top:'+t.toFixed(1)+'px">'+y+'</div>'}else html+='<div class="tick" style="top:'+t.toFixed(1)+'px"></div>'}
    ticks.innerHTML=html;
    let hideT=null,dragging=false,moved=false,lm=null;
    function setLbl(y){const s=findAt(offs,y+4);if(s.m!==lm){lm=s.m;lbl.textContent=monthShort(monthOf(s.m).date);if(dragging)haptic(6)}}
    function place(y){const t=toRail(y);cur.style.top=t+'px';lbl.style.top=t+'px'}
    function flash(){rail.classList.add('on');clearTimeout(hideT);hideT=setTimeout(()=>{if(!dragging)rail.classList.remove('on')},700)}
    const off=onScroll(screen,y=>{place(y);setLbl(y);flash()});
    function target(e){const r=rail.getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientY-r.top-PAD)/(railH-PAD*2)));return f*maxScroll()}
    rail.addEventListener('pointerdown',e=>{dragging=true;moved=false;rail.setPointerCapture(e.pointerId);rail.classList.add('on');const t=target(e);setLbl(t);place(t);e.preventDefault()});
    rail.addEventListener('pointermove',e=>{if(!dragging)return;moved=true;screen.scrollTop=target(e)});
    const end=e=>{if(!dragging)return;dragging=false;if(!moved){const t=target(e);screen.scrollTo({top:t,behavior:'smooth'})}flash()};
    rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);
    place(0);setLbl(0);
    return()=>{off();clearTimeout(hideT)};
  }
});
